<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kualoa Equine Weather</title><style>
:root{--bg:#eef1ed;--card:#fff;--ink:#202923;--muted:#6d7771;--line:#d9ded9;--good:#2f6b45;--watch:#a06a18;--caution:#b44f2f;--danger:#8b2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 20px 40px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}h1{margin:0;font-size:32px}h2{margin:0 0 4px;font-size:24px}.location,.updated,.small,.note,.coords{color:var(--muted)}.location{margin-top:5px}.coords{font-size:12px;margin-bottom:12px}.updated{font-size:13px;text-align:right}.locs{display:grid;grid-template-columns:1fr 1fr;gap:24px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 8px #0000000a}.current-label{color:var(--muted);font-size:14px}.temp{font-size:56px;font-weight:700;line-height:1}.unit{font-size:22px;color:var(--muted)}.metrics{display:flex;gap:24px;margin-top:14px}.metric-label{color:var(--muted);font-size:13px}.metric-value{font-size:22px;font-weight:700}.heat-card{display:flex;flex-direction:column;justify-content:center}.heat-title{color:var(--muted);font-size:14px}.heat-index{font-size:50px;font-weight:800;line-height:1;margin:7px 0}.status{font-size:17px;font-weight:700}.note{font-size:12px;line-height:1.4;margin-top:10px}.section-title{margin:20px 0 10px;font-size:16px}.periods,.details{display:grid;gap:12px}.periods{grid-template-columns:repeat(3,1fr)}.period{padding:14px}.time{font-weight:700;font-size:16px}.period-temp{font-size:30px;font-weight:700;margin:6px 0 2px}.mini-index{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-weight:700;font-size:14px}.details{grid-template-columns:repeat(4,1fr)}.details .card{padding:14px}.detail-value{font-size:20px;font-weight:700;margin-top:4px}.legend{display:flex;flex-wrap:wrap;gap:12px 20px;color:var(--muted);font-size:13px;margin-top:22px}.good{color:var(--good)}.watch{color:var(--watch)}.caution{color:var(--caution)}.danger{color:var(--danger)}@media(max-width:900px){.locs{grid-template-columns:1fr}}@media(max-width:560px){.hero{grid-template-columns:1fr}.periods{grid-template-columns:1fr}.details{grid-template-columns:repeat(2,1fr)}header{align-items:start;flex-direction:column}.updated{text-align:left}}
</style></head><body><div class="wrap"><header><div><h1>Kualoa Equine Weather</h1><div class="location">Kualoa Ranch area · Kualoa and Kaʻaʻawa</div></div><div class="updated" id="updated">Loading weather…</div></header>
<div class="locs" id="locs"></div>
<div class="legend"><span class="good">● Below 155 — LOW</span><span class="watch">● 155–165 — MODERATE</span><span class="caution">● Above 165–175 — HIGH</span><span class="danger">● Above 175 — EXTREME</span></div></div>
<script>
const LOCS=[{name:'Kualoa',lat:21.519917,lon:-157.839583},{name:'Kaʻaʻawa',lat:21.539028,lon:-157.841806}];
const API='https://api.open-meteo.com/v1/forecast?latitude='+LOCS.map(l=>l.lat).join(',')+'&longitude='+LOCS.map(l=>l.lon).join(',')+'&current=temperature_2m,relative_humidity_2m,dew_point_2m&hourly=temperature_2m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min,rain_sum,wind_speed_10m_max&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=Pacific%2FHonolulu&forecast_days=1';
function heatIndex(t,h){return Math.round(t+h)}
function status(i){return i<155?['LOW','good','Normal riding/tours with routine hydration and cooldown.']:i<=165?['MODERATE','watch','Monitor closely; increase water breaks and recovery time.']:i<=175?['HIGH','caution','Shorten tours, reduce workload, increase cooling, and monitor constantly.']:['EXTREME','danger','Consider postponing, canceling, or rescheduling tours.']}
function setStatus(el,i,mini=false){let[s,c,g]=status(i);el.textContent=mini?`Heat Index ${i} · ${s}`:s;el.className=(mini?'mini-index ':'status ')+c;if(!mini){let n=el.nextElementSibling;if(n)n.textContent=g}}
function nearest(times,target){let b=0,d=1e9;times.forEach((x,i)=>{let h=+x.slice(11,13),q=Math.abs(h-target);if(q<d){d=q;b=i}});return b}
function build(i,l){return `<section><h2>${l.name}</h2><div class="coords">${l.lat.toFixed(6)}, ${l.lon.toFixed(6)}</div>
<div class="hero"><div class="card"><div class="current-label">Current conditions</div><div><span class="temp" id="currentTemp${i}">—</span><span class="unit"> °F</span></div><div class="metrics"><div><div class="metric-label">Relative Humidity</div><div class="metric-value" id="currentHumidity${i}">—%</div></div><div><div class="metric-label">Dew Point</div><div class="metric-value" id="currentDew${i}">—°F</div></div></div></div>
<div class="card heat-card"><div class="heat-title">Equine Heat Index</div><div class="heat-index" id="currentIndex${i}">—</div><div class="status" id="currentStatus${i}">Waiting for data</div><div class="note">Kualoa operating guidance based on temperature + relative humidity. Use with horse condition, workload, shade, airflow and water access.</div></div></div>
<div class="section-title">Daily checkpoints</div><div class="periods">${[[7,'7:00 AM'],[13,'1:00 PM'],[18,'6:00 PM']].map(([h,t])=>`<div class="card period"><div class="time">${t}</div><div class="period-temp" id="t${h}_${i}">—</div><div class="small" id="h${h}_${i}">Humidity —</div><div class="mini-index" id="i${h}_${i}">Heat Index —</div></div>`).join('')}</div>
<div class="section-title">Other conditions</div><div class="details"><div class="card"><div class="small">Today's High</div><div class="detail-value" id="high${i}">—</div></div><div class="card"><div class="small">Today's Low</div><div class="detail-value" id="low${i}">—</div></div><div class="card"><div class="small">Rain</div><div class="detail-value" id="rain${i}">—</div></div><div class="card"><div class="small">Max Wind</div><div class="detail-value" id="wind${i}">—</div></div></div></section>`}
document.getElementById('locs').innerHTML=LOCS.map((l,i)=>build(i,l)).join('');
const $=id=>document.getElementById(id);
function fill(i,d){let c=d.current,t=+c.temperature_2m,h=+c.relative_humidity_2m,x=heatIndex(t,h);$('currentTemp'+i).textContent=Math.round(t);$('currentHumidity'+i).textContent=Math.round(h)+'%';$('currentDew'+i).textContent=Math.round(c.dew_point_2m)+'°F';$('currentIndex'+i).textContent=x;setStatus($('currentStatus'+i),x);[7,13,18].forEach(hr=>{let n=nearest(d.hourly.time,hr),tt=+d.hourly.temperature_2m[n],hh=+d.hourly.relative_humidity_2m[n];$('t'+hr+'_'+i).textContent=Math.round(tt)+'°F';$('h'+hr+'_'+i).textContent='Humidity '+Math.round(hh)+'%';setStatus($('i'+hr+'_'+i),heatIndex(tt,hh),true)});$('high'+i).textContent=Math.round(d.daily.temperature_2m_max[0])+'°F';$('low'+i).textContent=Math.round(d.daily.temperature_2m_min[0])+'°F';$('rain'+i).textContent=(+d.daily.rain_sum[0]).toFixed(2)+'"';$('wind'+i).textContent=Math.round(d.daily.wind_speed_10m_max[0])+' mph'}
async function load(){try{let r=await fetch(API);if(!r.ok)throw Error('request failed');let d=await r.json();if(!Array.isArray(d))d=[d];LOCS.forEach((l,i)=>fill(i,d[i]));$('updated').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+' · Open-Meteo'}catch(e){$('updated').textContent='Unable to load weather data';console.error(e)}}load();setInterval(load,9e5);
</script></body></html>
